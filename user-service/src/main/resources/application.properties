# Server configuration
server.port=${PORT:8080}
spring.profiles.active=@activatedProperties@
spring.application.name=user-service

# Management endpoints configuration
management.endpoints.web.exposure.include=metrics,health,info,caches
management.metrics.enable.cache=true

# Swagger configuration
springdoc.api-docs.path=/openapi/api-docs
springdoc.swagger-ui.path=/openapi/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packagesToScan=fr.ubs.sporttrack.controller

# Database configuration
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sporttrack}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Auto create admin user
admin.username=${ST_ADMIN_USERNAME:admin}
admin.email=${ST_ADMIN_EMAIL:admin@localhost}
admin.password=${ST_ADMIN_PASSWORD:admin}
admin.auto-create=${AUTO_CREATE_ADMIN:false}

# JWT configuration
jwt.secret=${JWT_SECRET}

# Eureka configuration
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.instance.preferIpAddress=true
eureka.instance.instanceId=${spring.application.name}:${random.value}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:localhost}