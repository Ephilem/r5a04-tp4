server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/ms-user/**
          filters:
            - StripPrefix=1
        - id: activity-service
          uri: http://127.0.0.1:8082
          predicates:
            - Path=/ms-activity/**
          filters:
            - StripPrefix=1