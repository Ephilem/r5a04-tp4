server:
  port: ${GATEWAY_PORT:8080}

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:${USER_SERVICE_PORT:8081}
          predicates:
            - Path=/ms-user/**
        - id: activity-service
          uri: http://localhost:${ACTIVITY_SERVICE_PORT:8082}
          predicates:
            - Path=/ms-activity/**