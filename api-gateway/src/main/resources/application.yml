server:
  port: ${GATEWAY_PORT:8080}

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/ms-user/**
          filters:
            - StripPrefix=1
        - id: activity-service
          uri: ${ACTIVITY_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/ms-activity/**
          filters:
            - StripPrefix=1